apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: devops-assignment
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            return 200 "Kubernetes DevOps Assignment - NGINX is working\n";
        }

        location /api/ {
            proxy_pass http://api-service:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /web/ {
            proxy_pass http://web-service:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy
  namespace: devops-assignment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-proxy
  template:
    metadata:
      labels:
        app: nginx-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy
  namespace: devops-assignment
spec:
  type: ClusterIP
  selector:
    app: nginx-proxy
  ports:
    - port: 80
      targetPort: 80
